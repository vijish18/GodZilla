[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "godzilla-quant"
version = "0.8.0"
description = "Fail-closed operational metadata foundation for Project GodZilla"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary" }
authors = [{ name = "Project GodZilla" }]
dependencies = [
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3",
  "PyYAML>=6.0.2,<7",
  "SQLAlchemy>=2.0,<2.1",
  "alembic>=1.13,<2",
  "psycopg[binary]>=3.2,<4",
  "tzdata>=2025.2; platform_system == 'Windows'",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.11,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.7,<1",
  "types-PyYAML>=6.0.12,<7",
  "hypothesis>=6,<7",
]

[project.scripts]
godzilla = "godzilla.app.cli:main"
godzilla-replay = "godzilla.market_data.replay_cli:main"
godzilla-event-replay = "godzilla.core.events.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["src"]
show_error_codes = true
warn_unreachable = true

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --basetemp=work/pytest"
testpaths = ["tests"]
markers = [
  "unit: isolated foundation unit tests",
  "integration: tests crossing component boundaries",
  "replay: deterministic event replay tests",
  "property: property-based invariant tests",
  "chaos: controlled failure-injection tests",
  "postgres: isolated local PostgreSQL integration and migration tests",
]

[tool.coverage.run]
branch = true
source = ["godzilla"]
omit = ["src/godzilla/__main__.py"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true
